<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8380d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anime Guess">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Anime Guess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE playful daily game, poster energy, quick to read on a phone
   IDEA a screen-printed anime release poster: big vermilion disc, heavy gothic lettering, halftone
   PICTURE the vermilion disc with today's guess slots; below, the stack of guess cards
   COLOUR paper white, ink black, vermilion lead; tiles: green hit, amber close, grey miss (plus symbols)
   TYPE Dela Gothic One for display + Inter
   LAYOUT phone: poster band, search, cards; wide: same column, cards show tiles in one row */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#141414,#f4f4f4);--mute:light-dark(#6d6d6d,#a3a3a3);--line:light-dark(#e3e3e3,#2e2e2e);--soft:light-dark(#f4f4f2,#1c1c1c);--red:#e8380d;--hit:light-dark(#1d9a55,#2fbf71);--near:light-dark(#e3a008,#f5b82e);--miss:light-dark(#8b8b8b,#4a4a4a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font:400 clamp(30px,8.5vw,42px)/1 "Dela Gothic One",Inter,sans-serif;margin:0;flex:1 1 auto;letter-spacing:-.01em}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.poster{position:relative;overflow:hidden;border-radius:20px;background:var(--red);color:#fff;padding:18px 18px 16px;margin-bottom:14px;min-height:150px}
.poster::before{content:"";position:absolute;right:-60px;top:-70px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#fff 0 1.2px,transparent 1.6px) 0 0/9px 9px,#ff6a3d;opacity:.55}
.poster::after{content:"";position:absolute;right:18px;top:20px;width:88px;height:88px;border-radius:50%;background:#fff;opacity:.92}
.poster > *{position:relative;z-index:1}
.poster .num{font:400 15px "Dela Gothic One",Inter,sans-serif;opacity:.95}
.poster h2{font:400 clamp(24px,6.5vw,32px)/1.08 "Dela Gothic One",Inter,sans-serif;margin:6px 0 12px;max-width:calc(100% - 120px)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots i{width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.85)}
.slots i.used{background:rgba(255,255,255,.85)}
.slots i.win{background:#fff;box-shadow:0 0 0 2px #141414 inset}
.searchbox{position:relative;margin-bottom:12px}
.searchbox input{width:100%;font-size:17px;padding:13px 14px;border-radius:14px;border:2px solid var(--ink);background:var(--bg);min-height:52px}
.searchbox input:focus{outline:3px solid color-mix(in srgb,var(--red) 50%,transparent);outline-offset:1px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.15);z-index:5;max-height:min(60vh,420px);overflow:auto;padding:4px;margin:0;list-style:none}
.sugg li{padding:10px 12px;border-radius:10px;cursor:pointer;line-height:1.3}
.sugg li[aria-selected=true],.sugg li:hover{background:var(--soft)}
.sugg small{display:block;color:var(--mute);font-size:13px}
.hints{display:grid;gap:6px;margin-bottom:12px}
.hint{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px}
.hint b{font-weight:700}
.cards{display:grid;gap:10px}
.gcard{border:1.5px solid var(--line);border-radius:16px;padding:12px}
.gcard h3{font:700 16px/1.3 Inter,sans-serif;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.gcard h3 small{color:var(--mute);font-weight:500}
.gcard.correct{border-color:var(--hit);box-shadow:0 0 0 2px var(--hit) inset}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.8fr)}}
.tile{border-radius:10px;padding:7px 6px;color:#fff;min-height:58px;display:flex;flex-direction:column;justify-content:space-between}
.tile span{font-size:11.5px;font-weight:600;opacity:.92}
.tile b{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.tile.hit{background:var(--hit)}.tile.near{background:var(--near);color:#1a1a1a}.tile.miss{background:var(--miss)}
.tile.wide{grid-column:span 4}.tile.two{grid-column:span 2}
@media(min-width:720px){.tile.wide,.tile.two{grid-column:auto}}
.end{border-radius:18px;padding:18px;background:var(--soft);margin-bottom:14px}
.end h2{font:400 26px/1.1 "Dela Gothic One",Inter,sans-serif;margin:0 0 4px}
.end p{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button,.row a{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.row .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.nums div{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center}
.nums b{display:block;font:400 26px/1.1 "Dela Gothic One",Inter,sans-serif}
.nums span{font-size:12.5px;color:var(--mute)}
.dist{display:grid;gap:5px}
.dist div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.dist i{display:block;height:20px;background:var(--red);border-radius:5px;color:#fff;font-style:normal;font-size:12px;text-align:right;padding-right:6px;line-height:20px;min-width:24px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:12px 0 0}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.credit{font-size:13px;color:var(--mute);margin-top:22px}
.credit a{color:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media(prefers-reduced-motion:no-preference){.gcard.new{animation:drop .3s ease-out}@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Anime Guess</h1>
    <div class="tabs" role="group" aria-label="Mode"><button data-m="daily" aria-pressed="true">Daily</button><button data-m="endless" aria-pressed="false">Endless</button><button data-m="stats" aria-pressed="false">Stats</button></div>
  </header>
  <div id="game">
    <div class="poster"><div class="num" id="pnum"></div><h2 id="ptitle">Guess today's anime in 8 tries</h2><div class="slots" id="slots"></div></div>
    <div id="endBox"></div>
    <div class="searchbox" id="searchBox">
      <input id="q" type="text" placeholder="Type an anime title…" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="sugg" aria-label="Guess an anime">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
    </div>
    <div class="hints" id="hints"></div>
    <div class="cards" id="cards"></div>
    <div class="legend"><span style="--c:var(--hit)">Match</span><span style="--c:var(--near)">Close</span><span style="--c:var(--miss)">No match</span><span>↑ answer is higher · ↓ lower</span></div>
  </div>
  <div id="stats" hidden></div>
  <p class="credit">Data from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>: titles and facts only. Not affiliated with AniList or any studio.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>/* Anime Guess — game logic (no DOM). Browser: window.AG; Node: module.exports. */
(function (root) {
  'use strict';
  const LAUNCH = '2026-11-17';
  const MAX_GUESSES = 8;
  const C = { id: 0, romaji: 1, english: 2, year: 3, season: 4, format: 5, episodes: 6, genres: 7, studio: 8, source: 9, score: 10, popularity: 11, tags: 12 };

  function dayNumber(dateStr) {
    const p = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
    return Math.round((p(dateStr) - p(LAUNCH)) / 86400000) + 1;
  }
  // Daily answers come from well-known TV series and films, so they are guessable.
  function dailyPool(rows) {
    const p = rows.filter(r => (r[C.format] === 'TV' || r[C.format] === 'MOVIE') && r[C.year] >= 1990)
      .sort((a, b) => b[C.popularity] - a[C.popularity]).slice(0, 400);
    return p.sort((a, b) => a[C.id] - b[C.id]);
  }
  function dailyIndex(n, day) {
    if (n <= 1) return 0;
    const gcd = (x, y) => (y ? gcd(y, x % y) : x);
    let a = Math.floor(n * 0.6180339887) | 1; while (gcd(a, n) !== 1) a++;
    const i = ((day - 1) % n + n) % n;
    return (a * i + (104729 % n)) % n;
  }

  const norm = s => (s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  function search(rows, q, exclude, limit) {
    const n = norm(q); if (n.length < 2) return [];
    const words = n.split(' ');
    const scored = [];
    for (const r of rows) {
      if (exclude && exclude.has(r[C.id])) continue;
      const a = norm(r[C.romaji]), b = norm(r[C.english]);
      let s = -1;
      for (const t of [a, b]) {
        if (!t) continue;
        if (t === n) s = Math.max(s, 100);
        else if (t.startsWith(n)) s = Math.max(s, 80);
        else if (words.every(w => t.includes(w))) s = Math.max(s, 50);
      }
      if (s >= 0) scored.push([s + Math.min(20, Math.log10(1 + r[C.popularity]) * 3), r]);
    }
    return scored.sort((x, y) => y[0] - x[0]).slice(0, limit || 8).map(x => x[1]);
  }

  // Compare one guess with the answer. Each tile: status hit | near | miss, plus a direction hint.
  function compare(g, t) {
    const num = (a, b, nearFn) => {
      if (a == null || b == null) return { s: 'miss', dir: '', v: a == null ? '?' : a };
      if (a === b) return { s: 'hit', dir: '', v: a };
      return { s: nearFn(a, b) ? 'near' : 'miss', dir: b > a ? 'up' : 'down', v: a };
    };
    const eq = (a, b) => ({ s: a != null && a === b ? 'hit' : 'miss', v: a == null ? '?' : a });
    const gs = new Set(g[C.genres]), shared = t[C.genres].filter(x => gs.has(x));
    const sameSet = shared.length === t[C.genres].length && shared.length === g[C.genres].length;
    return {
      correct: g[C.id] === t[C.id],
      year: num(g[C.year], t[C.year], (a, b) => Math.abs(a - b) <= 2),
      season: eq(g[C.season], t[C.season]),
      format: eq(g[C.format], t[C.format]),
      episodes: num(g[C.episodes], t[C.episodes], (a, b) => Math.abs(a - b) <= Math.max(3, 0.25 * b)),
      studio: eq(g[C.studio], t[C.studio]),
      source: eq(g[C.source], t[C.source]),
      score: num(g[C.score], t[C.score], (a, b) => Math.abs(a - b) <= 5),
      genres: { s: sameSet ? 'hit' : shared.length ? 'near' : 'miss', v: g[C.genres].join(', '), shared }
    };
  }
  function title(r) { return r[C.english] || r[C.romaji]; }

  const api = { LAUNCH, MAX_GUESSES, C, dayNumber, dailyPool, dailyIndex, search, compare, title, norm };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.AG = api;
})(typeof window !== 'undefined' ? window : this);
</script>
<script>if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}</script>
<script>
{
const AG = window.AG, C = AG.C, $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const today = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, k) => today(new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10) + k));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'ag:v1';
const blank = () => ({ daily: {}, dist: [0, 0, 0, 0, 0, 0, 0, 0, 0], endless: { played: 0, won: 0 } });
let S; try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let ROWS = [], BYID = new Map(), POOL = [], mode = 'daily', target = null, guesses = [], over = false, sel = -1, list = [];

function startDaily() {
  const d = today(), n = AG.dayNumber(d);
  target = POOL[AG.dailyIndex(POOL.length, n)];
  const saved = S.daily[d];
  guesses = saved ? saved.g.map(id => BYID.get(id)).filter(Boolean) : [];
  over = !!(saved && saved.done);
  $('pnum').textContent = `#${n} · ${new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}`;
  $('ptitle').textContent = "Guess today's anime in 8 tries";
  render(false);
}
function startEndless() {
  target = POOL[Math.floor(Math.random() * POOL.length)]; guesses = []; over = false;
  $('pnum').textContent = 'Endless'; $('ptitle').textContent = 'Name the anime in 8 tries';
  render(false);
}
function persist() {
  if (mode !== 'daily') return;
  const d = today(); S.daily[d] = { g: guesses.map(r => r[C.id]), done: over, won: guesses.some(r => r[C.id] === target[C.id]) }; save();
}

function tile(label, t, wide, two) {
  const arrow = t.dir === 'up' ? ' ↑' : t.dir === 'down' ? ' ↓' : '';
  const mark = t.s === 'hit' ? ' ✓' : '';
  return `<div class="tile ${t.s}${wide ? ' wide' : ''}${two ? ' two' : ''}"><span>${label}</span><b>${esc(t.v)}${arrow}${mark}</b></div>`;
}
function cardHtml(r, isNew) {
  const c = AG.compare(r, target);
  return `<div class="gcard${c.correct ? ' correct' : ''}${isNew ? ' new' : ''}"><h3>${esc(AG.title(r))}${r[C.english] ? `<small>${esc(r[C.romaji])}</small>` : ''}</h3><div class="tiles">
    ${tile('Year', c.year)}${tile('Season', c.season)}${tile('Format', c.format)}${tile('Episodes', c.episodes)}
    ${tile('Studio', c.studio, false, true)}${tile('Source', c.source)}${tile('Score', c.score)}${tile('Genres', { s: c.genres.s, v: c.genres.shared.length && c.genres.s !== 'hit' ? 'Shared: ' + c.genres.shared.join(', ') : c.genres.v }, true)}
  </div></div>`;
}
function render(animateNew) {
  const won = guesses.some(r => r[C.id] === target[C.id]);
  $('slots').innerHTML = Array.from({ length: AG.MAX_GUESSES }, (_, i) => `<i class="${i < guesses.length ? (won && i === guesses.length - 1 ? 'win' : 'used') : ''}"></i>`).join('');
  $('cards').innerHTML = guesses.slice().reverse().map((r, i) => cardHtml(r, animateNew && i === 0)).join('');
  const wrong = guesses.length - (won ? 1 : 0);
  let h = '';
  if (!won && wrong >= 3 && target[C.tags].length) h += `<div class="hint"><b>Hint:</b> tagged ${esc(target[C.tags].join(', '))}.</div>`;
  if (!won && wrong >= 6) h += `<div class="hint"><b>Hint:</b> the title starts with “${esc(AG.title(target)[0])}” and has ${AG.title(target).split(' ').length} word${AG.title(target).split(' ').length > 1 ? 's' : ''}.</div>`;
  $('hints').innerHTML = h;
  $('searchBox').hidden = over;
  $('endBox').innerHTML = over ? endHtml(won) : '';
  if (over) bindEnd(won);
}
function endHtml(won) {
  const t = target;
  return `<div class="end"><h2>${won ? `Got it in ${guesses.length}` : 'Out of guesses'}</h2>
    <p><b>${esc(AG.title(t))}</b>${t[C.english] ? ` (${esc(t[C.romaji])})` : ''}: ${t[C.year]} ${esc(t[C.format])}, ${esc(t[C.studio])}${t[C.episodes] ? `, ${t[C.episodes]} episode${t[C.episodes] > 1 ? 's' : ''}` : ''}.</p>
    <div class="row">${mode === 'daily' ? '<button class="primary" id="shareBtn">Copy result</button><button id="moreBtn">Play endless</button>' : '<button class="primary" id="againBtn">Next anime</button>'}<a href="https://anilist.co/anime/${t[C.id]}" target="_blank" rel="noopener">Open on AniList</a></div></div>`;
}
function bindEnd(won) {
  if ($('shareBtn')) $('shareBtn').onclick = () => copy(shareText(won));
  if ($('moreBtn')) $('moreBtn').onclick = () => setMode('endless');
  if ($('againBtn')) $('againBtn').onclick = startEndless;
}
function shareText(won) {
  const sq = { hit: '🟩', near: '🟨', miss: '⬛' };
  const lines = guesses.map(r => { const c = AG.compare(r, target); return ['year', 'season', 'format', 'episodes', 'studio', 'source', 'score', 'genres'].map(k => sq[c[k].s]).join(''); });
  return `Anime Guess #${AG.dayNumber(today())} ${won ? guesses.length : 'X'}/${AG.MAX_GUESSES}\n${lines.join('\n')}`;
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Copy not available here'); } a.remove(); }
}
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

function guess(r) {
  if (over || !r || guesses.some(g => g[C.id] === r[C.id])) return;
  guesses.push(r);
  const won = r[C.id] === target[C.id];
  if (won || guesses.length >= AG.MAX_GUESSES) {
    over = true;
    if (mode === 'daily') { S.dist[won ? guesses.length - 1 : 8]++; }
    else { S.endless.played++; if (won) S.endless.won++; }
  }
  persist(); save();
  $('q').value = ''; closeSugg(); render(true);
  if (!over) $('q').focus();
}

// autocomplete
function openSugg() {
  const ex = new Set(guesses.map(g => g[C.id]));
  list = AG.search(ROWS, $('q').value, ex, 8); sel = list.length ? 0 : -1;
  const u = $('sugg');
  if (!list.length) { closeSugg(); return; }
  u.innerHTML = list.map((r, i) => `<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i === sel}">${esc(AG.title(r))}<small>${r[C.english] ? esc(r[C.romaji]) + ' · ' : ''}${r[C.year]} · ${esc(r[C.format])}</small></li>`).join('');
  u.hidden = false; $('q').setAttribute('aria-expanded', 'true');
}
function closeSugg() { $('sugg').hidden = true; $('q').setAttribute('aria-expanded', 'false'); }
function moveSel(d) { if (!list.length) return; sel = (sel + d + list.length) % list.length; $('sugg').querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', i === sel)); $('opt' + sel).scrollIntoView({ block: 'nearest' }); }
$('q').addEventListener('input', openSugg);
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (sel >= 0) guess(list[sel]); }
  else if (e.key === 'Escape') closeSugg();
});
$('sugg').addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li) { e.preventDefault(); guess(list[+li.dataset.i]); } });
document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) closeSugg(); });

function streak() { let d = today(), n = 0; if (!(S.daily[d] && S.daily[d].won)) d = addDays(d, -1); while (S.daily[d] && S.daily[d].won) { n++; d = addDays(d, -1); } return n; }
function renderStats() {
  const days = Object.values(S.daily).filter(x => x.done), won = days.filter(x => x.won).length;
  const max = Math.max(1, ...S.dist);
  $('stats').innerHTML = `<div class="nums"><div><b>${days.length}</b><span>Played</span></div><div><b>${days.length ? Math.round(100 * won / days.length) : 0}%</b><span>Won</span></div><div><b>${streak()}</b><span>Streak</span></div><div><b>${S.endless.won}</b><span>Endless wins</span></div></div>
    <h2 style="font:400 22px 'Dela Gothic One',Inter,sans-serif;margin:8px 0">Daily guesses</h2>
    <div class="dist">${S.dist.map((n, i) => `<div><span>${i < 8 ? i + 1 : 'X'}</span><i style="width:${Math.max(6, 100 * n / max)}%">${n}</i></div>`).join('')}</div>`;
}
function setMode(m) {
  mode = m; document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  $('game').hidden = m === 'stats'; $('stats').hidden = m !== 'stats';
  if (m === 'daily') startDaily(); else if (m === 'endless') startEndless(); else renderStats();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.m));

async function boot() {
  let data = window.ANIME_DATA;
  if (!data) { try { data = await (await fetch('anime.json')).json(); } catch (e) { $('ptitle').textContent = 'Could not load data. Check your connection.'; return; } }
  ROWS = data.rows; ROWS.forEach(r => BYID.set(r[C.id], r)); POOL = AG.dailyPool(ROWS);
  const hot = window.claude && window.claude.hot;
  const start = d => setMode(d && ['daily', 'endless', 'stats'].includes(d.mode) ? d.mode : 'daily');
  if (hot && hot.snapshot) hot.snapshot(() => ({ mode }));
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
}
window.__ag = () => ({ target: target && target[C.id], title: target && AG.title(target), guesses: guesses.length, over, mode });
boot();
}
</script>

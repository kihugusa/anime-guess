name: Refresh anime data
# Pulls the most popular anime (facts only) from AniList, rebuilds the site into docs/ and commits.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 3 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch from AniList
        run: node scripts/fetch_anime.mjs 30 > docs/anime.json
      - name: Validate
        run: node tests/validate.mjs docs/anime.json
      - name: Build site
        run: |
          pip install --quiet pillow
          node build.mjs
          cp -r dist/web/. docs/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Refresh anime data from AniList"
          git push
